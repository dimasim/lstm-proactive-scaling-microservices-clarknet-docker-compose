global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

frontend http_front
    bind *:80
    
    acl url_media path_beg /media
    acl url_content path_beg /content
    
    use_backend media_back if url_media
    use_backend content_back if url_content

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 100ms
    timeout retry   100ms
    hold other      1s
    hold refused    1s
    hold nx         1s
    hold timeout    1s
    hold valid      100ms
    hold obsolete   100ms

backend media_back
    balance leastconn
    server-template media 1-13 media-service:8000 check maxconn 18 resolvers docker resolve-prefer ipv4

backend content_back
    balance leastconn
    server-template content 1-5 content-service:8000 check maxconn 18 resolvers docker resolve-prefer ipv4
